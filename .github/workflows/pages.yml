name: GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir _site
          cp 古辞書ビューワー/index.html 古辞書ビューワー/styles.css 古辞書ビューワー/app.js 古辞書ビューワー/manifest.webmanifest 古辞書ビューワー/icon-192.png 古辞書ビューワー/icon-512.png 古辞書ビューワー/apple-touch-icon.png 古辞書ビューワー/sw.js 古辞書ビューワー/THIRD_PARTY_NOTICES.md 古辞書ビューワー/data-v3.js _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
