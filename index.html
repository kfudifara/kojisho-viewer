<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta id="themeColor" name="theme-color" content="#212121">
  <script>
    (() => {
      let saved;
      try { saved = localStorage.getItem('kojisho.theme'); } catch (_) {}
      const theme = saved || 'dark';
      document.documentElement.dataset.theme = theme;
      document.getElementById('themeColor').content = theme === 'light' ? '#ffffff' : '#212121';
    })();
  </script>
  <title>古辞書ビューワー</title>
  <link rel="manifest" href="manifest.webmanifest?v=45">
  <link rel="icon" type="image/svg+xml" href="icon.svg?v=45">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=45">
  <link rel="stylesheet" href="styles.css?v=46">
</head>
<body>
  <header>
    <button id="menu" class="icon sidebar-icon" aria-label="サイドバーを切り替える" aria-controls="sidebar" aria-expanded="true" title="サイドバーを切り替える"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/></svg></button>
    <button id="resetApp" class="brand" type="button" aria-label="初期位置に戻る" title="初期位置に戻る"><strong>古辞書ビューワー</strong></button>
    <p id="position" class="header-position" aria-live="polite"><span id="desktopPositionHeading" class="position-heading"></span><span id="desktopPositionDetail" class="position-detail"></span></p>
    <p id="mobilePosition" class="header-position" aria-live="polite"><span id="mobilePositionHeading" class="position-heading"></span><span id="mobilePositionDetail" class="position-detail"></span></p>
    <button id="themeToggle" class="icon theme-icon" aria-label="ライトモードに切り替える" title="表示モードを切り替える"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/></svg></button>
  </header>
  <main>
    <aside id="sidebar">
      <label>辞書<select id="dictionary"></select></label>
      <label>巻<select id="volume"></select></label>
      <div class="sidebar-field">
        <label for="sidebarPage">丁・頁</label>
        <div class="page-face-row">
          <select id="sidebarPage"></select>
          <div id="sidebarFaces" class="faces" aria-label="面"></div>
        </div>
      </div>
      <form id="locationSearch" class="location-search" role="search">
        <div class="field-label"><label for="locationQuery">直接入力</label><button id="sidebarHelpToggle" class="help-button" type="button" aria-label="直接入力のヘルプ" aria-controls="inputHelpDialog"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.8 9a2.3 2.3 0 1 1 3.4 2c-.9.5-1.2 1.1-1.2 2M12 17h.01"/></svg></button></div>
        <input id="locationQuery" type="search" autocomplete="off" placeholder="例：1-1オ／上1オ／1オ／1">
        <p id="locationError" role="alert" aria-live="polite"></p>
      </form>
    </aside>
    <div id="scrim"></div>
    <section class="workspace">
      <div id="viewer" aria-label="IIIF画像ビューワー">
        <span class="edge-hint edge-next" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M15.5 5L8.5 12l7 7"/></svg></span>
        <span class="edge-hint edge-previous" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8.5 5l7 7-7 7"/></svg></span>
        <div id="locationPopover" class="location-popover" hidden>
          <label>辞書<select id="bottomDictionary"></select></label>
          <label>巻<select id="bottomVolume"></select></label>
          <div class="popover-field">
            <label for="page">丁・頁</label>
            <div class="page-face-row">
              <select id="page"></select>
              <div id="faces" class="faces" aria-label="面"></div>
            </div>
          </div>
          <form id="bottomLocationSearch" class="popover-field" role="search">
            <div class="field-label"><label for="bottomLocationQuery">直接入力</label><button id="popoverHelpToggle" class="help-button" type="button" aria-label="直接入力のヘルプ" aria-controls="inputHelpDialog"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.8 9a2.3 2.3 0 1 1 3.4 2c-.9.5-1.2 1.1-1.2 2M12 17h.01"/></svg></button></div>
            <input id="bottomLocationQuery" type="search" autocomplete="off" placeholder="例：1-1オ／上1オ／1オ／1">
            <p id="bottomLocationError" role="alert" aria-live="polite"></p>
          </form>
        </div>
        <div class="tools">
          <button id="locationToggle" aria-label="資料と表示箇所を選択" data-tooltip="資料と表示箇所を選択" aria-controls="locationPopover" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 5.5c3.1-.8 5.9-.3 8.5 1.5v13c-2.6-1.8-5.4-2.3-8.5-1.5zM20.5 5.5c-3.1-.8-5.9-.3-8.5 1.5v13c2.6-1.8 5.4-2.3 8.5-1.5z"/></svg></button>
          <button id="zoomOut" aria-label="縮小" data-tooltip="縮小"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
          <button id="home" aria-label="全体表示" data-tooltip="全体表示"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="1"/><path d="M8 8h8v8H8z" fill="currentColor" stroke="none"/></svg></button>
          <button id="zoomIn" aria-label="拡大" data-tooltip="拡大"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
          <button id="fullscreen" aria-label="全画面表示" data-tooltip="全画面表示" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M3 16v5h5"/></svg></button>
          <a id="source" class="tool-button" target="_blank" rel="noopener" aria-label="国立国会図書館デジタルコレクションで開く" data-tooltip="国立国会図書館デジタルコレクションで開く"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 5h6v6M19 5l-9 9M11 7H5v12h12v-6"/></svg></a>
        </div>
        <button id="exitFullscreen" type="button" aria-label="全画面を終了">×</button>
      </div>
      <div id="notice">読み込み中</div>
    </section>
  </main>
  <dialog id="inputHelpDialog" class="help-dialog" aria-labelledby="inputHelpTitle">
    <div class="dialog-heading"><h2 id="inputHelpTitle">直接入力ヘルプ</h2><button id="inputHelpClose" class="dialog-close" type="button" aria-label="閉じる">×</button></div>
    <div class="help-content">
      <table class="input-example-table">
        <colgroup><col><col><col></colgroup>
        <thead><tr><th>入力例</th><th>巻</th><th>丁・頁</th></tr></thead>
        <tbody>
          <tr><td><code>1-1オ</code></td><td>巻1</td><td>1オ</td></tr>
          <tr><td><code>上1オ</code></td><td>上</td><td>1オ</td></tr>
          <tr><td><code>1オ</code></td><td>選択中の巻</td><td>1オ</td></tr>
          <tr><td><code>1</code></td><td>選択中の巻</td><td>1オ</td></tr>
        </tbody>
      </table>
      <p class="help-note">※現在選択中の辞書を対象にする。</p>
      <h3>入力について</h3>
      <ul>
        <li>数字は全角・半角のどちらでも入力可能</li>
        <li>オ／ウを省略した場合はオを開く</li>
        <li>「<code>-</code>」と「<code>ー</code>」は同じ記号として扱う</li>
        <li>「<code>お</code>」「<code>a</code>」は「オ」として扱う</li>
        <li>「<code>う</code>」「<code>b</code>」は「ウ」として扱う</li>
      </ul>
    </div>
  </dialog>
  <script src="https://cdn.jsdelivr.net/npm/openseadragon@6.0.2/build/openseadragon/openseadragon.min.js"></script>
  <script src="data-v3.js"></script>
  <script src="app.js?v=47"></script>
</body>
</html>
