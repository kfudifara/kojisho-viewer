<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta id="themeColor" name="theme-color" content="#17140f">
  <script>
    (() => {
      let saved;
      try { saved = localStorage.getItem('kojisho.theme'); } catch (_) {}
      const theme = saved || 'dark';
      document.documentElement.dataset.theme = theme;
      document.getElementById('themeColor').content = theme === 'light' ? '#f3efe5' : '#17140f';
    })();
  </script>
  <title>古辞書ビューワー</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg?v=20">
  <link rel="stylesheet" href="styles.css?v=30">
</head>
<body>
  <header>
    <button id="menu" class="icon" aria-label="目次を開く" aria-controls="sidebar" aria-expanded="false">☰</button>
    <div class="brand"><strong>古辞書ビューワー</strong></div>
    <p id="position" aria-live="polite"></p>
    <button id="themeToggle" class="icon" aria-label="ライトモードに切り替える" title="表示モードを切り替える">☀</button>
    <a id="source" class="source-credit" target="_blank" rel="noopener" aria-label="出典：国立国会図書館デジタルコレクション">
      <span class="source-full">出典：国立国会図書館デジタルコレクション</span>
      <span class="source-short">出典：NDL</span><span aria-hidden="true">↗</span>
    </a>
  </header>
  <main>
    <aside id="sidebar">
      <div class="aside-title"><strong>資料を選ぶ</strong><button id="collapseSidebar" class="sidebar-toggle" type="button" aria-label="資料選択を折りたたむ" title="資料選択を折りたたむ"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M7 9l-3 3 3 3"/></svg></button></div>
      <label>辞書名<select id="dictionary"></select></label>
      <label>巻<select id="volume"></select></label>
      <form id="locationSearch" class="location-search" role="search">
        <label for="locationQuery">巻・頁・面を開く</label>
        <input id="locationQuery" type="search" autocomplete="off" placeholder="例：上1オ">
        <p id="locationError" role="alert" aria-live="polite"></p>
      </form>
      <label>頁を検索<input id="pageSearch" type="search" inputmode="numeric" placeholder="例：25"></label>
      <div id="toc" aria-label="頁一覧"></div>
    </aside>
    <div id="scrim"></div>
    <section class="workspace">
      <div id="viewer" aria-label="IIIF画像ビューワー">
        <button id="expandSidebar" class="sidebar-toggle expand-sidebar" type="button" aria-label="資料選択を表示" title="資料選択を表示"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M5 9l3 3-3 3"/></svg></button>
        <span class="edge-hint edge-next" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></span>
        <span class="edge-hint edge-previous" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></span>
        <div class="tools">
          <button id="zoomOut" aria-label="縮小">−</button>
          <button id="home" aria-label="全体表示">▣</button>
          <button id="zoomIn" aria-label="拡大">＋</button>
          <button id="fullscreen" aria-label="全画面">⛶</button>
        </div>
        <button id="exitFullscreen" type="button" aria-label="全画面を終了">× <span>全画面を終了</span></button>
      </div>
      <div id="notice">読み込み中</div>
      <nav class="pager">
        <div class="location-controls">
          <select id="bottomDictionary" aria-label="辞書名"></select>
          <select id="bottomVolume" aria-label="巻"></select>
          <select id="page" aria-label="頁"></select>
          <div id="faces" aria-label="面"></div>
        </div>
      </nav>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/openseadragon@6.0.2/build/openseadragon/openseadragon.min.js"></script>
  <script src="data-v3.js"></script>
  <script src="app.js?v=30"></script>
</body>
</html>
