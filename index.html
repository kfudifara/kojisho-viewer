<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17140f">
  <title>古辞書ビューワー</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css?v=15">
</head>
<body>
  <header>
    <button id="menu" class="icon" aria-label="目次を開く" aria-controls="sidebar" aria-expanded="false">☰</button>
    <div class="brand"><strong>古辞書ビューワー</strong></div>
    <p id="position" aria-live="polite"></p>
    <button id="themeToggle" class="icon" aria-label="ライトモードに切り替える" title="表示モードを切り替える">☀</button>
    <a id="source" class="icon" target="_blank" rel="noopener" aria-label="国立国会図書館で開く">↗</a>
  </header>
  <main>
    <aside id="sidebar">
      <div class="aside-title"><strong>資料を選ぶ</strong><button id="close" class="icon" aria-label="閉じる">×</button></div>
      <label>辞書名<select id="dictionary"></select></label>
      <label>巻<select id="volume"></select></label>
      <label>頁を検索<input id="pageSearch" type="search" inputmode="numeric" placeholder="例：25"></label>
      <div id="toc" aria-label="頁一覧"></div>
    </aside>
    <div id="scrim"></div>
    <section class="workspace">
      <div id="viewer" aria-label="IIIF画像ビューワー">
        <button id="exitFullscreen" type="button" aria-label="全画面を終了">× <span>全画面を終了</span></button>
      </div>
      <div id="notice">画像を読み込んでいる</div>
      <nav class="pager">
        <button id="next"><span>次</span> ‹</button>
        <div class="location-controls">
          <select id="bottomDictionary" aria-label="辞書名"></select>
          <div class="dropup" id="bottomVolumeControl">
            <button id="bottomVolume" type="button" aria-haspopup="listbox" aria-expanded="false">巻</button>
            <div id="bottomVolumeMenu" class="dropup-menu" role="listbox" hidden></div>
          </div>
          <select id="page" aria-label="頁"></select>
          <div id="faces" aria-label="面"></div>
        </div>
        <button id="previous">› <span>前</span></button>
      </nav>
      <div class="tools">
        <button id="zoomOut" aria-label="縮小">−</button><button id="home">全体表示</button><button id="zoomIn" aria-label="拡大">＋</button>
        <i></i><button id="rotateLeft" aria-label="左回転">↶</button><button id="rotateRight" aria-label="右回転">↷</button><button id="fullscreen" aria-label="全画面">⛶</button>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/openseadragon@6.0.2/build/openseadragon/openseadragon.min.js"></script>
  <script src="data-v3.js"></script>
  <script src="app.js?v=15"></script>
</body>
</html>
