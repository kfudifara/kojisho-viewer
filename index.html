<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#17140f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>古辞書ビューワー</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button id="tocToggle" class="icon-button" aria-label="目次を開く">☰</button>
    <div class="title"><span>古辞書</span><small>ビューワー</small></div>
    <div id="location" class="location" aria-live="polite"></div>
    <button id="sourceButton" class="icon-button" aria-label="国立国会図書館で開く">↗</button>
  </header>

  <main>
    <aside id="sidebar" class="sidebar" aria-label="辞書と目次">
      <div class="sidebar-head">
        <strong>目次</strong>
        <button id="closeSidebar" class="icon-button" aria-label="目次を閉じる">×</button>
      </div>
      <label>辞書<select id="dictionary"></select></label>
      <label>巻<select id="volume"></select></label>
      <div id="toc" class="toc"></div>
    </aside>
    <div id="scrim" class="scrim"></div>

    <section class="viewer-shell">
      <div id="viewer" class="viewer" aria-label="辞書画像。ピンチで拡大、ドラッグで移動">
        <div id="stage" class="stage">
          <img id="pageImage" alt="古辞書の画像" draggable="false">
        </div>
        <div id="loading" class="loading"><span></span><p>画像を読み込んでいます</p></div>
        <div id="error" class="error" hidden><strong>画像を表示できません</strong><span>通信状態を確認して、もう一度お試しください。</span><button id="retry">再読み込み</button></div>
        <button id="previousFrame" class="edge edge-left" aria-label="次のコマ">‹</button>
        <button id="nextFrame" class="edge edge-right" aria-label="前のコマ">›</button>
        <div id="zoomBadge" class="zoom-badge">全体</div>
      </div>

      <nav class="controls" aria-label="ページ操作">
        <button id="previous" class="nav-button"><span>‹</span>前</button>
        <div class="page-controls">
          <select id="page" aria-label="頁"></select>
          <div id="faces" class="segmented" aria-label="面"></div>
        </div>
        <button id="next" class="nav-button">次<span>›</span></button>
      </nav>

      <div class="tools" aria-label="画像操作">
        <button id="zoomOut" aria-label="縮小">−</button>
        <button id="fit" class="wide">全体表示</button>
        <button id="zoomIn" aria-label="拡大">＋</button>
        <span class="separator"></span>
        <button id="rotateLeft" aria-label="左に回転">↶</button>
        <button id="rotateRight" aria-label="右に回転">↷</button>
      </div>
    </section>
  </main>
  <script src="data-v3.js"></script>
  <script src="app-v3.js"></script>
</body>
</html>
