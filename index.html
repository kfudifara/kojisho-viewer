<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta id="themeColor" name="theme-color" content="#212121">
  <script>
    (() => {
      let saved;
      try { saved = localStorage.getItem('kojisho.theme'); } catch (_) {}
      const theme = saved || 'dark';
      document.documentElement.dataset.theme = theme;
      document.getElementById('themeColor').content = theme === 'light' ? '#ffffff' : '#212121';
    })();
  </script>
  <title>古辞書ビューワー</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg?v=20">
  <link rel="stylesheet" href="styles.css?v=42">
</head>
<body>
  <header>
    <button id="menu" class="icon sidebar-icon" aria-label="サイドバーを切り替える" aria-controls="sidebar" aria-expanded="true" title="サイドバーを切り替える"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/></svg></button>
    <button id="resetApp" class="brand" type="button" aria-label="初期位置に戻る" title="初期位置に戻る"><strong>古辞書ビューワー</strong></button>
    <p id="position" aria-live="polite"></p>
    <p id="mobilePosition" aria-hidden="true"></p>
    <button id="themeToggle" class="icon theme-icon" aria-label="ライトモードに切り替える" title="表示モードを切り替える"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/></svg></button>
  </header>
  <main>
    <aside id="sidebar">
      <label>辞書を選択<select id="dictionary"></select></label>
      <form id="locationSearch" class="location-search" role="search">
        <label for="locationQuery">位置を入力</label>
        <input id="locationQuery" type="search" autocomplete="off" placeholder="例：1-1オ／上1オ">
        <p id="locationError" role="alert" aria-live="polite"></p>
      </form>
      <label>巻を選択<select id="volume"></select></label>
      <div class="toc-label">丁・頁を選択</div>
      <div id="toc" aria-label="丁・頁一覧"></div>
    </aside>
    <div id="scrim"></div>
    <section class="workspace">
      <div id="viewer" aria-label="IIIF画像ビューワー">
        <span class="edge-hint edge-next" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M15.5 5L8.5 12l7 7"/></svg></span>
        <span class="edge-hint edge-previous" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8.5 5l7 7-7 7"/></svg></span>
        <div class="tools">
          <button id="zoomOut" aria-label="縮小"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
          <button id="home" aria-label="全体表示"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="1"/><path d="M8 8h8v8H8z" fill="currentColor" stroke="none"/></svg></button>
          <button id="zoomIn" aria-label="拡大"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
          <button id="fullscreen" aria-label="全画面" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M3 16v5h5"/></svg></button>
        </div>
        <button id="exitFullscreen" type="button" aria-label="全画面を終了">× <span>全画面を終了</span></button>
      </div>
      <div id="notice">読み込み中</div>
      <nav class="pager">
        <button id="mobileLocationToggle" class="mobile-location-toggle" type="button" aria-controls="mobileLocationPanel" aria-expanded="false">
          <span id="mobileLocationSummary"></span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg>
        </button>
        <button id="mobileLocationScrim" class="mobile-location-scrim" type="button" aria-label="位置選択を閉じる" tabindex="-1"></button>
        <div id="mobileLocationPanel" class="mobile-location-panel">
          <div class="mobile-location-heading"><span>位置を選択</span><button id="mobileLocationClose" type="button" aria-label="位置選択を閉じる">×</button></div>
        <div class="location-controls">
          <div class="location-primary-row">
            <select id="bottomDictionary" aria-label="辞書名"></select>
            <select id="bottomVolume" aria-label="巻"></select>
          </div>
          <div class="location-secondary-row">
            <select id="page" aria-label="頁"></select>
            <div id="faces" aria-label="面"></div>
            <div class="bottom-location-group">
              <form id="bottomLocationSearch" class="bottom-location-search" role="search">
                <input id="bottomLocationQuery" type="search" autocomplete="off" aria-label="位置を入力" placeholder="例：1-1オ">
              </form>
              <a id="source" class="external-link" target="_blank" rel="noopener" aria-label="国立国会図書館デジタルコレクション" title="国立国会図書館デジタルコレクション"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 5h6v6M19 5l-9 9M11 7H5v12h12v-6"/></svg></a>
            </div>
          </div>
        </div>
        </div>
      </nav>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/openseadragon@6.0.2/build/openseadragon/openseadragon.min.js"></script>
  <script src="data-v3.js"></script>
  <script src="app.js?v=42"></script>
</body>
</html>
